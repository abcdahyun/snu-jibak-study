<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>지박령 스터디 · 출석부</title><meta name="description" content="서울대 시험기간 지박령 스터디의 출석 기록과 랭킹"><style>/* STYLES */</style></head>
<body>
<header class="top"><a class="brand" href="#">스터디 출석부</a></header>
<main>
<div class="heading"><p>10.05–10.25 · 오후 10시 · 더벤티 앞</p><div class="goal"><span>15일 출석</span></div></div>
<div class="tabs" role="tablist" aria-label="화면 선택"><button id="ranking-tab" class="active" role="tab" aria-controls="ranking-panel" aria-selected="true">출석 랭킹</button><button id="attendance-tab" role="tab" aria-controls="attendance-panel" aria-selected="false">출석 체크</button><span id="period-status">10월 5일 시작</span></div>
<div id="notice" role="status" class="notice" hidden></div>
<section id="ranking-panel" role="tabpanel" aria-labelledby="ranking-tab">
<div class="ranking-layout"><section class="podium-card" aria-label="상위 순위"><div class="podium" id="podium"></div></section><aside class="summary"><div class="stat"><span>참가자</span><strong id="total-members">7<small>명</small></strong></div><div class="stat"><span>15일 달성</span><strong id="goal-members">0<small>명</small></strong></div></aside></div>
<section class="leaderboard"><div class="section-head"><h2>전체 랭킹 <span id="rank-count">7</span></h2><span>누적 출석순 · 동점은 이름순</span></div><div class="table-wrap"><table><thead><tr><th>순위</th><th>참가자</th><th>출석</th><th class="progress-col">15일 목표</th><th>달성 여부</th></tr></thead><tbody id="ranking-body"></tbody></table></div></section>
</section>
<section id="attendance-panel" role="tabpanel" aria-labelledby="attendance-tab" hidden>
<div class="attendance-heading"><span class="help">자동 저장</span><label>출석 날짜<input type="date" id="attendance-date" min="2026-10-05" max="2026-10-25"></label></div>
<div class="date-strip" id="date-strip" aria-label="출석일 선택"></div><div class="attendance-meta"><strong id="selected-label"></strong><span id="selected-count"></span></div><div id="attendance-list" class="attendance-list"></div>
</section>
<section class="admin-controls">
<p id="admin-status"></p>
<form id="admin-login"><label for="admin-password">관리자 비밀번호</label><input id="admin-password" type="password" autocomplete="current-password" required maxlength="512"><button type="submit">관리자 로그인</button></form>
<button id="admin-logout" hidden>로그아웃</button>
</section>
</main><script type="module">/* APP */</script></body></html>
